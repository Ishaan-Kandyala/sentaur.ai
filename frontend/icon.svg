<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" role="img" aria-label="Sentaur AI">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a6cf7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="58" height="58" rx="16" fill="url(#g)"/>
  <rect x="1" y="1" width="58" height="32" rx="16" fill="url(#shine)"/>
  <circle cx="46" cy="11" r="2.8" fill="#fff" opacity="0.85" filter="url(#glow)"/>
  <circle cx="52" cy="21" r="1.8" fill="#fff" opacity="0.60"/>
  <circle cx="14" cy="48" r="1.8" fill="#fff" opacity="0.45"/>
  <line x1="46" y1="11" x2="52" y2="21" stroke="#fff" stroke-width="0.8" opacity="0.3"/>
  <text x="30" y="44"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="38" font-weight="800" fill="#fff"
    text-anchor="middle" letter-spacing="-1">S</text>
</svg>
