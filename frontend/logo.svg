<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 60" role="img" aria-label="Sentaur AI">
  <defs>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a6cf7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ── Badge ── -->
  <rect x="1" y="1" width="58" height="58" rx="16" fill="url(#badgeGrad)"/>
  <!-- Shine overlay -->
  <rect x="1" y="1" width="58" height="32" rx="16" fill="url(#shineGrad)"/>

  <!-- ── Star accents (Centaurus constellation) ── -->
  <circle cx="46" cy="11" r="2.8" fill="#ffffff" opacity="0.85" filter="url(#glow)"/>
  <circle cx="52" cy="21" r="1.8" fill="#ffffff" opacity="0.60"/>
  <circle cx="14" cy="48" r="1.8" fill="#ffffff" opacity="0.45"/>
  <circle cx="10" cy="14" r="1.2" fill="#ffffff" opacity="0.35"/>
  <!-- Connecting dot line -->
  <line x1="46" y1="11" x2="52" y2="21" stroke="#ffffff" stroke-width="0.8" opacity="0.3"/>

  <!-- ── S letter ── -->
  <text x="30" y="44"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="38" font-weight="800" fill="#ffffff"
    text-anchor="middle" dominant-baseline="auto"
    letter-spacing="-1">S</text>

  <!-- ── Wordmark ── -->
  <!-- "Sentaur" -->
  <text x="74" y="31"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="22" font-weight="700" fill="#1a1a2e" letter-spacing="-0.3">Sentaur</text>

  <!-- Thin divider -->
  <line x1="74" y1="36" x2="222" y2="36" stroke="#e0e7ef" stroke-width="1"/>

  <!-- "AI" in accent color -->
  <text x="74" y="52"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="12" font-weight="600" fill="#4a6cf7" letter-spacing="5">AI</text>
</svg>
