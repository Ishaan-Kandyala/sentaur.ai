<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sentrinox AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            font-family: 'Inter', sans-serif;
            color: #fff;
            overflow: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #0b0b0d;
        }

        /* ── Hex background ── */
        .bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }

        .bg::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse 90% 90% at 105% 105%, rgba(241,70,33,.09) 0%, transparent 60%),
                radial-gradient(ellipse 60% 60% at 0% 0%,  rgba(0,0,0,.6) 0%, transparent 70%);
        }

        .bg svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }


        /* ── Content ── */
        .hero {
            position: relative;
            z-index: 1;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .brand-logo {
            width: auto;
            height: auto;
            max-width: min(420px, 78vw);
        }

        .divider {
            width: 38px;
            height: 2px;
            background: #f14621;
            border-radius: 2px;
        }

        .tagline {
            font-size: 28px;
            color: #999;
            font-weight: 400;
        }

        .tagline strong {
            color: #f14621;
            font-weight: 600;
        }

        .access-form {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }

        .access-form input[type="email"] {
            width: 296px;
            padding: 13px 16px;
            background: #13131a;
            border: 1px solid #252530;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color .2s;
        }

        .access-form input[type="email"]::placeholder { color: #444; }
        .access-form input[type="email"]:focus { border-color: rgba(241,70,33,.6); }

        .access-form button {
            padding: 13px 22px;
            background: #f14621;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            white-space: nowrap;
            transition: background .18s, transform .12s;
        }

        .access-form button:hover  { background: #d9400f; }
        .access-form button:active { transform: scale(.97); }

        @media (max-width: 520px) {
            .access-form { flex-direction: column; width: calc(100vw - 48px); }
            .access-form input[type="email"] { width: 100%; }
            .brand-logo { max-width: 75vw; }
        }
    </style>
</head>
<body>

<div class="bg">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
        <defs>
            <pattern id="hex-tile" x="0" y="0" width="130" height="225" patternUnits="userSpaceOnUse">
                <!-- Row 1: center (65, 75) -->
                <polygon points="65,0 130,37.5 130,112.5 65,150 0,112.5 0,37.5"
                    fill="#252530" stroke="#0d0d10" stroke-width="0.7"/>
                <!-- Row 2: center (0, 187.5) -->
                <polygon points="0,112.5 65,150 65,225 0,262.5 -65,225 -65,150"
                    fill="#252530" stroke="#0d0d10" stroke-width="0.7"/>
                <!-- Row 2: center (130, 187.5) -->
                <polygon points="130,112.5 195,150 195,225 130,262.5 65,225 65,150"
                    fill="#252530" stroke="#0d0d10" stroke-width="0.7"/>
                <!-- Wrap: bottom of row-2 hexes that tile back to top of pattern -->
                <polygon points="0,-112.5 65,-75 65,0 0,37.5 -65,0 -65,-75"
                    fill="#252530" stroke="#0d0d10" stroke-width="0.7"/>
                <polygon points="130,-112.5 195,-75 195,0 130,37.5 65,0 65,-75"
                    fill="#252530" stroke="#0d0d10" stroke-width="0.7"/>
            </pattern>

            <!-- Global dark top-left → transparent bottom-right sweep -->
            <linearGradient id="dark-sweep" x1="0" y1="0" x2="1920" y2="1080" gradientUnits="userSpaceOnUse">
                <stop offset="0%"   stop-color="#000" stop-opacity="0.97"/>
                <stop offset="20%"  stop-color="#000" stop-opacity="0.80"/>
                <stop offset="48%"  stop-color="#000" stop-opacity="0.35"/>
                <stop offset="72%"  stop-color="#000" stop-opacity="0"/>
            </linearGradient>

            <radialGradient id="fade" cx="960" cy="540" r="900" gradientUnits="userSpaceOnUse">
                <stop offset="0%"   stop-color="#fff" stop-opacity="0.10"/>
                <stop offset="55%"  stop-color="#fff" stop-opacity="0.03"/>
                <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
            </radialGradient>
            <!-- orange edge tracers -->
            <linearGradient id="tracer1" x1="0" y1="0" x2="1920" y2="1080" gradientUnits="userSpaceOnUse">
                <stop offset="0%"   stop-color="#f14621" stop-opacity="0"/>
                <stop offset="50%"  stop-color="#f14621" stop-opacity="0.7"/>
                <stop offset="100%" stop-color="#f14621" stop-opacity="0"/>
            </linearGradient>
            <linearGradient id="tracer2" x1="1920" y1="0" x2="0" y2="1080" gradientUnits="userSpaceOnUse">
                <stop offset="0%"   stop-color="#f14621" stop-opacity="0"/>
                <stop offset="50%"  stop-color="#f14621" stop-opacity="0.5"/>
                <stop offset="100%" stop-color="#f14621" stop-opacity="0"/>
            </linearGradient>
        </defs>
        <rect width="1920" height="1080" fill="url(#hex-tile)"/>
        <rect width="1920" height="1080" fill="url(#dark-sweep)"/>
        <rect width="1920" height="1080" fill="url(#fade)"/>
        <!-- subtle orange edge lines in bottom-right -->
        <line x1="1497" y1="1080" x2="1920" y2="669" stroke="url(#tracer1)" stroke-width="1.5" opacity="0.5"/>
        <line x1="1766" y1="1080" x2="1920" y2="864" stroke="url(#tracer2)" stroke-width="1.5" opacity="0.35"/>
        <line x1="1920" y1="486" x2="1632" y2="1080" stroke="url(#tracer1)" stroke-width="1.2" opacity="0.25"/>
    </svg>
</div>

<main class="hero">
    <div class="brand">
        <img src="/DarkLogoSentrinox.svg" alt="Sentrinox AI" class="brand-logo">
    </div>

    <div class="divider"></div>

    <p class="tagline">Chaos to <strong>Controlled Autonomy</strong></p>

    <form class="access-form" onsubmit="handleAccess(event)">
        <input type="email" placeholder="you@yourcompany.com" required>
        <button type="submit">Get Early Access</button>
    </form>
</main>

<script>
    function handleAccess(e) {
        e.preventDefault();
        window.location.href = '/signup.html';
    }
</script>

</body>
</html>
